    <ellipse cx="770" cy="350" rx="130" ry="24" fill="#ffffff" stroke="#16a34a" stroke-width="2" filter="url(#drop-shadow)" />
    <text x="770" y="355" font-size="12.5" font-weight="600" fill="#14532d" text-anchor="middle">UC-10: Triage &amp; Resolve Incidents</text>
  </g>

