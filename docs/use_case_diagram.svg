  <g id="uc-rules">
    <ellipse cx="770" cy="625" rx="135" ry="25" fill="#ffffff" stroke="#e11d48" stroke-width="2" filter="url(#drop-shadow)" />
    <text x="770" y="630" font-size="12" font-weight="600" fill="#881337" text-anchor="middle">UC-11: Configure Rules &amp; Multipliers</text>
  </g>

  <!-- UC12: User & Role Administration -->
  <g id="uc-users">
    <ellipse cx="770" cy="695" rx="130" ry="24" fill="#ffffff" stroke="#e11d48" stroke-width="2" filter="url(#drop-shadow)" />
    <text x="770" y="700" font-size="12" font-weight="600" fill="#881337" text-anchor="middle">UC-12: Manage Users &amp; RBAC Roles</text>
  </g>

  <!-- UC13: Cryptographic Audit Chaining -->
  <g id="uc-audit-chain">
    <ellipse cx="600" cy="775" rx="145" ry="28" fill="#fdf4ff" stroke="#a21caf" stroke-width="2.2" stroke-dasharray="4,3" filter="url(#drop-shadow)" />
    <text x="600" y="771" font-size="12.5" font-weight="700" fill="#701a75" text-anchor="middle">«include» Log SHA-256 Audit Block</text>
    <text x="600" y="787" font-size="10.5" fill="#86198f" text-anchor="middle">(Forward Hash Linking for Non-Repudiation)</text>
  </g>

  <!-- UC14: Verify Audit Ledger Integrity -->
  <g id="uc-verify-ledger">
    <ellipse cx="430" cy="855" rx="140" ry="26" fill="#ffffff" stroke="#a21caf" stroke-width="2" filter="url(#drop-shadow)" />
    <text x="430" y="852" font-size="12.5" font-weight="600" fill="#701a75" text-anchor="middle">UC-14: Verify Audit Chain Integrity</text>
    <text x="430" y="867" font-size="10.5" fill="#86198f" text-anchor="middle">(Detect Database Tampering &amp; Deletions)</text>
  </g>


  <!-- ================= ASSOCIATION LINES ================= -->

  <!-- Employee Connections -->
  <line x1="160" y1="280" x2="305" y2="185" stroke="#2563eb" stroke-width="1.8" />
  <line x1="160" y1="280" x2="295" y2="250" stroke="#2563eb" stroke-width="1.8" />
  <line x1="160" y1="280" x2="300" y2="325" stroke="#2563eb" stroke-width="1.8" />

  <!-- Dependency: Workflows & QuickLook -> Harvest Telemetry -->
  <path d="M 430 276 Q 440 370 495 395" fill="none" stroke="#475569" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arrow)" />
  <text x="450" y="360" font-size="10" font-weight="bold" fill="#475569">«include»</text>

  <path d="M 430 349 Q 470 380 500 395" fill="none" stroke="#475569" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arrow)" />

  <!-- Dependency: Harvest Telemetry -> Evaluate Risk Score -->
  <line x1="600" y1="431" x2="600" y2="457" stroke="#475569" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arrow)" />
  <text x="608" y="448" font-size="10" font-weight="bold" fill="#475569">«include»</text>

  <!-- Extend: Evaluate Risk Score -> Auto-Lock Workstation -->
  <path d="M 525 508 Q 450 525 435 537" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#extend-arrow)" />
  <text x="475" y="522" font-size="10.5" font-weight="bold" fill="#dc2626">«extend»</text>

  <!-- Include: Auto-Lock & Unlocks -> Audit Block -->
  <path d="M 430 593 Q 445 740 505 765" fill="none" stroke="#a21caf" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arrow)" />
  <path d="M 430 676 Q 460 740 505 765" fill="none" stroke="#a21caf" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arrow)" />
  <text x="470" y="730" font-size="10" font-weight="bold" fill="#a21caf">«include»</text>

  <!-- SOC Analyst Connections -->
  <line x1="1040" y1="280" x2="905" y2="195" stroke="#16a34a" stroke-width="1.8" />
  <line x1="1040" y1="280" x2="910" y2="270" stroke="#16a34a" stroke-width="1.8" />
  <line x1="1040" y1="280" x2="900" y2="350" stroke="#16a34a" stroke-width="1.8" />

  <!-- Security Admin Connections -->
  <line x1="1040" y1="640" x2="905" y2="625" stroke="#e11d48" stroke-width="1.8" />
  <line x1="1040" y1="640" x2="900" y2="695" stroke="#e11d48" stroke-width="1.8" />
  <line x1="1040" y1="640" x2="565" y2="650" stroke="#e11d48" stroke-width="1.8" />

  <!-- Compliance Auditor Connections -->
  <line x1="160" y1="760" x2="330" y2="840" stroke="#a21caf" stroke-width="1.8" />
  <line x1="160" y1="760" x2="455" y2="785" stroke="#a21caf" stroke-width="1.8" />

  <!-- ================= LEGEND BOX ================= -->
  <rect x="30" y="870" width="200" height="70" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
  <text x="40" y="888" font-size="11" font-weight="bold" fill="#334155">LEGEND</text>
  <line x1="40" y1="903" x2="70" y2="903" stroke="#2563eb" stroke-width="2" />
  <text x="78" y="907" font-size="10" fill="#475569">Actor Association</text>
  <line x1="40" y1="923" x2="70" y2="923" stroke="#475569" stroke-width="1.8" stroke-dasharray="4,3" />
  <text x="78" y="927" font-size="10" fill="#475569">«include» / «extend»</text>
</svg>
