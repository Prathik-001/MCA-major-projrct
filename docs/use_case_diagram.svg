<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 950" width="100%" height="100%" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Shadow filter for clean modern look -->
    <filter id="drop-shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.08" />
    </filter>
    <filter id="actor-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.12" />
    </filter>

    <!-- Marker for dashed dependency arrows -->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
    <marker id="extend-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
  </defs>

  <!-- Title Header -->
  <rect x="30" y="20" width="1140" height="65" rx="8" fill="#0f172a" />
  <text x="600" y="46" font-size="19" font-weight="bold" fill="#f8fafc" text-anchor="middle" letter-spacing="0.5">USE CASE DIAGRAM: UBA SENTINEL INSIDER THREAT DETECTION SYSTEM</text>
  <text x="600" y="68" font-size="13" fill="#94a3b8" text-anchor="middle">Student: Prathik Hegde (4MT25MC064) | Guide: Dr. Anushree Raj | Academic Year: 2026–2027</text>

  <!-- ================= SYSTEM BOUNDARY ================= -->
  <rect x="250" y="105" width="700" height="815" rx="14" fill="#f8fafc" stroke="#334155" stroke-width="2.5" stroke-dasharray="none" filter="url(#drop-shadow)" />
  <rect x="250" y="105" width="700" height="38" rx="14" fill="#e2e8f0" />
  <!-- fix top rounded corners clip -->
  <rect x="250" y="125" width="700" height="18" fill="#e2e8f0" />
  <text x="600" y="130" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="middle" letter-spacing="0.5">«System Boundary» UBA Sentinel Framework</text>

  <!-- ================= STICK FIGURE ACTOR MACROS ================= -->
  
  <!-- ACTOR 1: EMPLOYEE (Top Left) -->
  <g transform="translate(60, 200)">
    <circle cx="50" cy="25" r="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5" filter="url(#actor-shadow)" />
    <!-- Torso -->
    <line x1="50" y1="41" x2="50" y2="85" stroke="#2563eb" stroke-width="2.5" />
    <!-- Arms -->
    <line x1="20" y1="58" x2="80" y2="58" stroke="#2563eb" stroke-width="2.5" />
    <!-- Legs -->
    <line x1="50" y1="85" x2="25" y2="125" stroke="#2563eb" stroke-width="2.5" />
    <line x1="50" y1="85" x2="75" y2="125" stroke="#2563eb" stroke-width="2.5" />
    <!-- Label -->
    <rect x="-5" y="135" width="110" height="38" rx="6" fill="#dbeafe" stroke="#bfdbfe" />
    <text x="50" y="152" font-size="12" font-weight="bold" fill="#1e40af" text-anchor="middle">Corporate</text>
    <text x="50" y="166" font-size="12" font-weight="bold" fill="#1e40af" text-anchor="middle">Employee</text>
  </g>

  <!-- ACTOR 2: COMPLIANCE AUDITOR (Bottom Left) -->
  <g transform="translate(60, 680)">
    <circle cx="50" cy="25" r="16" fill="#fdf4ff" stroke="#a21caf" stroke-width="2.5" filter="url(#actor-shadow)" />
    <line x1="50" y1="41" x2="50" y2="85" stroke="#a21caf" stroke-width="2.5" />
    <line x1="20" y1="58" x2="80" y2="58" stroke="#a21caf" stroke-width="2.5" />
    <line x1="50" y1="85" x2="25" y2="125" stroke="#a21caf" stroke-width="2.5" />
    <line x1="50" y1="85" x2="75" y2="125" stroke="#a21caf" stroke-width="2.5" />
    <rect x="-5" y="135" width="110" height="38" rx="6" fill="#fae8ff" stroke="#f5d0fe" />
    <text x="50" y="152" font-size="12" font-weight="bold" fill="#86198f" text-anchor="middle">Compliance</text>
    <text x="50" y="166" font-size="12" font-weight="bold" fill="#86198f" text-anchor="middle">Auditor</text>
  </g>

  <!-- ACTOR 3: SOC SECURITY ANALYST (Top Right) -->
  <g transform="translate(1040, 200)">
