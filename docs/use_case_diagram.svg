    <line x1="50" y1="41" x2="50" y2="85" stroke="#16a34a" stroke-width="2.5" />
    <line x1="20" y1="58" x2="80" y2="58" stroke="#16a34a" stroke-width="2.5" />
    <line x1="50" y1="85" x2="25" y2="125" stroke="#16a34a" stroke-width="2.5" />
    <line x1="50" y1="85" x2="75" y2="125" stroke="#16a34a" stroke-width="2.5" />
    <rect x="-10" y="135" width="120" height="38" rx="6" fill="#dcfce7" stroke="#bbf7d0" />
    <text x="50" y="152" font-size="12" font-weight="bold" fill="#15803d" text-anchor="middle">SOC Security</text>
    <text x="50" y="166" font-size="12" font-weight="bold" fill="#15803d" text-anchor="middle">Analyst</text>
  </g>

  <!-- ACTOR 4: SECURITY ADMINISTRATOR (Bottom Right) -->
  <g transform="translate(1040, 560)">
    <circle cx="50" cy="25" r="16" fill="#fff1f2" stroke="#e11d48" stroke-width="2.5" filter="url(#actor-shadow)" />
    <line x1="50" y1="41" x2="50" y2="85" stroke="#e11d48" stroke-width="2.5" />
    <line x1="20" y1="58" x2="80" y2="58" stroke="#e11d48" stroke-width="2.5" />
    <line x1="50" y1="85" x2="25" y2="125" stroke="#e11d48" stroke-width="2.5" />
    <line x1="50" y1="85" x2="75" y2="125" stroke="#e11d48" stroke-width="2.5" />
    <rect x="-10" y="135" width="120" height="38" rx="6" fill="#ffe4e6" stroke="#fecdd3" />
